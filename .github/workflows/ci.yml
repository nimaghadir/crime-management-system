name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Services
        # Starts both backend and frontend in the background
        run: docker compose up -d --build

      - name: Wait for Backend to Initialize
        # Gunicorn and Django migrations take a few seconds to boot up.
        run: |
          echo "Waiting for services to become healthy..."
          sleep 15
          docker compose logs backend

      - name: Run Backend Tests
        # Executes Django's built-in test runner inside the running backend container
        run: docker compose exec -T backend python manage.py test

      - name: Basic E2E Test (Curl Backend)
        # Tries to curl the backend up to 5 times. 
        # Using /admin/ login page as it's a guaranteed Django route.
        run: |
          curl --fail --retry 5 --retry-connrefused --retry-delay 5 http://localhost:8000/admin/login/
          echo "Backend is reachable!"

      - name: Basic E2E Test (Curl Frontend)
        # Verifies the Vite dev server is serving the React app
        run: |
          curl --fail --retry 5 --retry-connrefused --retry-delay 5 http://localhost:5173/
          echo "Frontend is reachable!"

      - name: Tear Down
        if: always()
        run: docker compose down

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: >
      sh -c "python manage.py migrate 2>/tmp/migrate.err || (
      if grep -q InconsistentMigrationHistory /tmp/migrate.err; then
      echo 'Detected inconsistent SQLite migration history; backing up db.sqlite3 and recreating.';
      [ -f db.sqlite3 ] && mv db.sqlite3 db.sqlite3.inconsistent.$$(date +%s);
      python manage.py migrate;
      else
      cat /tmp/migrate.err;
      exit 1;
      fi
      ) &&
      python manage.py create_roles &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: /api
      VITE_USE_MOCK_API: "true"
      VITE_USE_MOCK_FALLBACK: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
